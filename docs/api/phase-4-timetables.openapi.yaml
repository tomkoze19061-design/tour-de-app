openapi: 3.0.3
info:
  title: Think different Academy Transport API – Phase 4
  version: 1.0.0
  license:
    name: MIT
  description: |
    Read-only API contract for trips and timetables introduced in phase 4.
    It extends the phase 3 static-network API.

    A trip follows exactly one route. The route determines the line, direction
    and order of its stops. Phase 4 endpoints expose the timetable data used by
    the passenger-facing application.
servers:
  - url: /
security: []
tags:
  - name: Lines
    description: Read trips of a line.
  - name: Trips
    description: Read a trip and its timetable.
  - name: Stops
    description: Read departures from a stop.
paths:
  /api/v1/lines/{lineId}/trips:
    parameters:
      - $ref: '#/components/parameters/LineId'
    get:
      tags: [Lines]
      summary: List trips of a line
      description: |
        Returns all scheduled trips of the requested line.
      operationId: listLineTrips
      responses:
        '200':
          description: Scheduled trips of the requested line.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      summary: Get trip detail and timetable
      description: |
        Returns the line, direction and ordered timetable of one trip.
      operationId: getTrip
      responses:
        '200':
          description: Trip detail and timetable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stops/{stopId}/departures:
    parameters:
      - $ref: '#/components/parameters/StopId'
    get:
      tags: [Stops]
      summary: List departures from a stop
      description: |
        Returns scheduled departures from the requested stop in ascending order
        by `departure_day_offset` and `departure_time`.
      operationId: listStopDepartures
      responses:
        '200':
          description: Chronological departures from the selected stop.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    StopId:
      name: stopId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: Invalid identifier or query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource does not exist or is not in service on the selected date.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    Time:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '08:35'
      description: Local clock time in 24-hour HH:MM format.
    DayOffset:
      type: integer
      minimum: 0
      example: 0
      description: |
        Number of calendar days after the day on which the trip starts. A
        departure at 00:14 after a trip left at 23:52 has a day offset of 1.
    Direction:
      type: string
      enum: [outbound, inbound]
      description: '`outbound` travels away from the line''s starting stop; `inbound` travels back towards it.'
    Line:
      type: object
      additionalProperties: false
      required: [id, number, name, type, color]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        number:
          type: string
          maxLength: 32
          example: B
        name:
          type: string
          maxLength: 255
          example: Campus Connector
        type:
          type: string
          maxLength: 255
          example: shuttle
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#F4C542'
    StopSummary:
      type: object
      additionalProperties: false
      required: [id, name, image_url]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 255
          example: Kernel Hub
        image_url:
          type: string
          format: uri
          maxLength: 255
          nullable: true
    TripSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - line
        - direction
        - origin
        - destination
        - departure_time
        - departure_day_offset
      properties:
        id:
          $ref: '#/components/schemas/Id'
        line:
          $ref: '#/components/schemas/Line'
        direction:
          $ref: '#/components/schemas/Direction'
        origin:
          $ref: '#/components/schemas/StopSummary'
        destination:
          $ref: '#/components/schemas/StopSummary'
        departure_time:
          $ref: '#/components/schemas/Time'
        departure_day_offset:
          $ref: '#/components/schemas/DayOffset'
    TripStopTime:
      type: object
      additionalProperties: false
      required:
        - stop_order
        - stop
        - arrival_time
        - arrival_day_offset
        - departure_time
        - departure_day_offset
      properties:
        stop_order:
          type: integer
          minimum: 1
          example: 2
        stop:
          $ref: '#/components/schemas/StopSummary'
        arrival_time:
          $ref: '#/components/schemas/Time'
        arrival_day_offset:
          $ref: '#/components/schemas/DayOffset'
        departure_time:
          $ref: '#/components/schemas/Time'
        departure_day_offset:
          $ref: '#/components/schemas/DayOffset'
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          additionalProperties: false
          required: [stops]
          properties:
            stops:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/TripStopTime'
    Departure:
      type: object
      additionalProperties: false
      required:
        - trip_id
        - line
        - direction
        - destination
        - arrival_time
        - arrival_day_offset
        - departure_time
        - departure_day_offset
      properties:
        trip_id:
          $ref: '#/components/schemas/Id'
        line:
          $ref: '#/components/schemas/Line'
        direction:
          $ref: '#/components/schemas/Direction'
        destination:
          $ref: '#/components/schemas/StopSummary'
        arrival_time:
          $ref: '#/components/schemas/Time'
        arrival_day_offset:
          $ref: '#/components/schemas/DayOffset'
        departure_time:
          $ref: '#/components/schemas/Time'
        departure_day_offset:
          $ref: '#/components/schemas/DayOffset'
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          example: Invalid request data.
